<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bola de cañon VdO </title>
    
    <!-- ========================================== -->
    <!-- MOTOR DE GOOGLE (OBLIGATORIO)              -->
    <!-- No borrar: Es la librería que lee el 3D    -->
    <!-- ========================================== -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    
    <style>
        /* ========================================== */
        /* ESTILOS DE LA PANTALLA (OBLIGATORIO)       -->
        /* ========================================== */
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #1a1a1a; /* Color de fondo general */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative; /* Ancla necesaria para los elementos flotantes */
        }

        model-viewer {
            width: 100%;
            height: 100%;
        }

        /* ========================================== */
        /* ESTILOS: DESCRIPCIÓN SEMI-TRANSPARENTE     -->
        /* Si borrás este bloque, borrá también el HTML abajo */
        /* ========================================== */
        .caja-descripcion {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5); /* Fondo negro semitransparente */
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 13px;
            max-width: 280px;
            z-index: 10;
            pointer-events: none; /* Hace que el dedo atraviese el texto y mueva el 3D */
        }

        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- APARTADO: VISOR 3D PRINCIPAL (OBLIGATORIO) -->
    <!-- Modificá "15_9_2026.glb" por tu archivo    -->
    <!-- ========================================== -->
    <model-viewer 
        src="Bala de cañon.glb" 
        alt="Pieza arqueológica" 
        camera-controls 
        shadow-intensity="1">
    </model-viewer>

    <!-- ========================================== -->
    <!-- APARTADO: CAJA DE DESCRIPCIÓN (OPCIONAL)   -->
    <!-- Modificá el texto o borrá todo este bloque -->
    <!-- ========================================== -->
    <div class="caja-descripcion">
        <b>Bola de cañon</b><br>
        Pequeña bola de cañon, hallada en el sitio Vuelta de obligado
    </div>

</body>
</html>
